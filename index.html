<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101528">
  <title>Acara Perpisahan & Penyambutan</title>
  <style>
    :root { --bg:#101528; --panel:rgba(255,255,255,.08); --line:rgba(255,255,255,.16); --text:#f8f8fc; --muted:#c7ccdc; --gold:#e7c987; }
    * { box-sizing:border-box }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    body { overflow:hidden; }
    button { font:inherit; cursor:pointer; }
    .app { position:relative; min-height:100vh; min-height:100dvh; overflow:hidden; background:radial-gradient(ellipse at 18% 12%, #29365d 0, transparent 40%),radial-gradient(ellipse at 84% 86%, #392b4c 0, transparent 42%),linear-gradient(135deg,#101528,#17192e 55%,#111321); }
    .app:before,.app:after { content:""; position:absolute; width:34rem;height:34rem;border:1px solid rgba(231,201,135,.12);border-radius:50%;pointer-events:none; }
    .app:before { top:-22rem;right:-8rem;box-shadow:0 0 0 35px rgba(231,201,135,.025),0 0 0 70px rgba(231,201,135,.02); }
    .app:after { bottom:-25rem;left:-12rem;box-shadow:0 0 0 40px rgba(255,255,255,.018),0 0 0 80px rgba(255,255,255,.012); }
    .topbar { position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;gap:12px; }
    .brand { font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700; }
    .counter { color:var(--muted);font-size:.85rem; }
    .stage { position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:100px 24px 120px;text-align:center; }
    .screen { width:min(100%,1100px);animation:appear .7s ease both; }
    .eyebrow { color:var(--gold);font-size:.78rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;margin-bottom:22px; }
    h1 { margin:0 auto 22px;max-width:1000px;font-size:clamp(2.3rem,6.7vw,5.8rem);line-height:1.08;letter-spacing:-.045em;font-weight:750;text-wrap:balance; }
    .lead { max-width:760px;margin:0 auto;color:var(--muted);font-size:clamp(1rem,2vw,1.3rem);line-height:1.8;text-wrap:balance; }
    .ornament { display:flex;align-items:center;gap:14px;justify-content:center;margin:28px auto;color:var(--gold); }
    .ornament:before,.ornament:after { content:"";width:72px;height:1px;background:linear-gradient(90deg,transparent,var(--gold)); }
    .ornament:after { transform:scaleX(-1); }
    .video-wrap { width:min(100%,1100px);margin:auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#050609;box-shadow:0 25px 90px #0007; }
    video { display:block;width:100%;max-height:68vh;aspect-ratio:16/9;background:#050609;object-fit:contain; }
    .video-caption { padding:14px 18px;color:var(--muted);font-size:.9rem;text-align:left;background:rgba(255,255,255,.045); }
    .controls { position:absolute;z-index:5;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:18px 20px 24px;background:linear-gradient(transparent,rgba(5,7,16,.65)); }
    .btn { border:1px solid var(--line);border-radius:999px;padding:11px 18px;color:var(--text);background:rgba(255,255,255,.08);transition:.2s; }
    .btn:hover { transform:translateY(-1px);background:rgba(255,255,255,.16); }
    .btn.primary { background:var(--gold);color:#1a1a22;border-color:var(--gold);font-weight:750; }
    .btn:disabled { opacity:.35;cursor:not-allowed;transform:none; }
    .hint { position:absolute;bottom:83px;left:0;right:0;text-align:center;color:#aeb4c8;font-size:.75rem;z-index:3;pointer-events:none; }
    .progress { position:absolute;top:0;left:0;right:0;height:3px;background:#ffffff12;z-index:8; }
    .progress span { display:block;height:100%;width:0;background:var(--gold);transition:width .25s; }
    .dots { display:flex;justify-content:center;gap:7px;margin-top:28px; }
    .dot { width:7px;height:7px;border-radius:50%;background:#ffffff35; }
    .dot.active { background:var(--gold);box-shadow:0 0 12px #e7c98788; }
    .footer-note { margin-top:24px;color:#8f96ae;font-size:.78rem;letter-spacing:.04em; }
    .toast { position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:10;background:#0b0e1bd9;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:.85rem;display:none; }
    @keyframes appear { from { opacity:0;transform:translateY(12px) } to { opacity:1;transform:translateY(0) } }
    @media(max-width:600px) { .topbar{padding:16px}.brand{font-size:.65rem;letter-spacing:.12em}.stage{padding:88px 18px 145px}.controls{gap:7px;padding:14px 10px 18px}.btn{padding:10px 13px;font-size:.85rem}.hint{bottom:125px}.video-caption{text-align:center} }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after{animation:none!important;transition:none!important} }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="progress"><span id="progress"></span></div>
  <header class="topbar">
    <div class="brand">Momen • Kenangan • Harapan</div>
    <div class="counter" id="counter">Sesi 1 dari 7</div>
  </header>
  <div class="toast" id="toast" role="status"></div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="hint">Pintasan: ← sebelumnya · → berikutnya · F layar penuh · Spasi putar/jeda video</div>
  <nav class="controls" aria-label="Kontrol presentasi">
    <button class="btn" id="prevBtn" type="button">← Kembali</button>
    <button class="btn" id="playBtn" type="button">▶ Putar video</button>
    <button class="btn" id="fullscreenBtn" type="button">⛶ Layar penuh</button>
    <button class="btn primary" id="nextBtn" type="button">Lanjut →</button>
  </nav>
</div>
<script>
  // Ubah judul dan teks sesi di daftar ini sesuai kebutuhan acara.
  const sessions = [
    {type:"text", eyebrow:"Selamat Datang", title:"Sebuah Momen, Sejuta Kenangan", body:"Selamat datang. Mari kita mulai acara ini dengan rasa syukur, penghormatan, dan hati yang terbuka untuk setiap kenangan serta harapan baru.", label:"Pembukaan"},
    {type:"video", eyebrow:"Mengawali dengan Khidmat", title:"Indonesia Raya", body:"Mohon berdiri dengan sikap sempurna.", src:"videos/video-1.mp4", label:"Indonesia Raya"},
    {type:"text", eyebrow:"Jeda • Mengenang Perjalanan", title:"Setiap Perjalanan Punya Cerita", body:"Di balik setiap langkah, ada kerja keras, tawa, tantangan, dan orang-orang yang membuat perjalanan ini berarti. Mari sejenak mengenang semua hal baik yang telah kita lalui bersama.", label:"Jeda 1"},
    {type:"video", eyebrow:"Kilas Perjalanan", title:"Kenangan Bersama", body:"", src:"videos/video-2.mp4", label:"Video Kenangan"},
    {type:"text", eyebrow:"Jeda • Perpisahan", title:"Berpisah Bukan Berarti Melupakan", body:"Waktu mungkin membawa kita ke arah yang berbeda, tetapi kenangan dan kebaikan yang dibagikan akan tetap tinggal. Terima kasih telah menjadi bagian dari cerita ini.", label:"Jeda 2"},
    {type:"video", eyebrow:"Momen Kebersamaan", title:"Himne NPWP", body:"", src:"videos/himna-npwp.mp4", label:"Himne NPWP"},
    {type:"text", eyebrow:"Sampai Jumpa", title:"Selamat Melangkah ke Babak Berikutnya", body:"Terima kasih atas kebersamaan, dedikasi, dan setiap kenangan yang telah tercipta. Semoga langkah selanjutnya dipenuhi keberhasilan, kesehatan, dan kebahagiaan. Sampai bertemu lagi!", label:"Penutup"}
  ];
  let current = 0;
  const stage = document.getElementById("stage");
  const counter = document.getElementById("counter");
  const progress = document.getElementById("progress");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const playBtn = document.getElementById("playBtn");
  const toast = document.getElementById("toast");
  let toastTimer;

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function render() {
    const s = sessions[current];
    if (s.type === "video") {
      stage.innerHTML = `<section class="screen"><div class="eyebrow">${esc(s.eyebrow)}</div><h1 style="font-size:clamp(1.8rem,4vw,3.2rem);margin-bottom:22px">${esc(s.title)}</h1><div class="video-wrap"><video id="mainVideo" controls playsinline preload="metadata"><source src="${esc(s.src)}" type="video/mp4">Browser Anda tidak mendukung pemutar video.</video>${s.body ? `<div class="video-caption">${esc(s.body)}</div>` : ""}</div><div class="footer-note">Jika video tidak otomatis berjalan, tekan tombol putar pada video.</div></section>`;
      const video = document.getElementById("mainVideo");
      video.addEventListener("ended", () => showToast("Video selesai. Tekan “Lanjut” untuk meneruskan acara."));
      video.addEventListener("play", () => playBtn.textContent = "⏸ Jeda video");
      video.addEventListener("pause", () => playBtn.textContent = "▶ Putar video");
    } else {
      stage.innerHTML = `<section class="screen"><div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1><div class="ornament">✦</div><p class="lead">${esc(s.body)}</p><div class="dots">${sessions.map((_,i)=>`<span class="dot ${i===current?"active":""}"></span>`).join("")}</div><div class="footer-note">${esc(s.label)} · ${current+1} / ${sessions.length}</div></section>`;
    }
    counter.textContent = `Sesi ${current + 1} dari ${sessions.length}`;
    progress.style.width = `${((current+1)/sessions.length)*100}%`;
    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === sessions.length-1 ? "↻ Ulang dari awal" : "Lanjut →";
    playBtn.style.display = s.type === "video" ? "" : "none";
    if (s.type !== "video") playBtn.textContent = "▶ Putar video";
  }
  function goTo(index) {
    const oldVideo = document.getElementById("mainVideo");
    if (oldVideo) { oldVideo.pause(); oldVideo.removeAttribute("src"); }
    current = (index + sessions.length) % sessions.length;
    render();
  }
  function showToast(message) {
    toast.textContent = message; toast.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.style.display = "none", 2800);
  }
  prevBtn.addEventListener("click", () => { if (current > 0) goTo(current-1); });
  nextBtn.addEventListener("click", () => {
    if (current === sessions.length-1) { goTo(0); showToast("Presentasi kembali ke awal."); }
    else goTo(current+1);
  });
  playBtn.addEventListener("click", async () => {
    const video = document.getElementById("mainVideo");
    if (!video) return;
    try { if (video.paused) await video.play(); else video.pause(); }
    catch { showToast("Tekan tombol putar langsung pada video untuk memulai."); }
  });
  document.getElementById("fullscreenBtn").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.getElementById("app").requestFullscreen();
      else await document.exitFullscreen();
    } catch { showToast("Layar penuh tidak tersedia pada browser ini."); }
  });
  document.addEventListener("keydown", e => {
    const tag = document.activeElement?.tagName;
    if (["INPUT","TEXTAREA","SELECT"].includes(tag)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); if (current < sessions.length-1) goTo(current+1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); if (current > 0) goTo(current-1); }
    else if (e.key.toLowerCase() === "f") document.getElementById("fullscreenBtn").click();
    else if (e.code === "Space" && sessions[current].type === "video") { e.preventDefault(); playBtn.click(); }
    else if (e.key === "Home") goTo(0);
    else if (e.key === "End") goTo(sessions.length-1);
  });
  render();
</script>
</body>
</html>
